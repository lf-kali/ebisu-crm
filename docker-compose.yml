# Infraestrutura local de desenvolvimento (D-T08). Os apps rodam no host com `pnpm dev`.
# Portas e credenciais vêm do .env (copie de .env.example); os padrões abaixo evitam
# conflito com Postgres/Redis instalados nativamente.
name: ebisu-crm

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebisu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebisu}
      POSTGRES_DB: ${POSTGRES_DB:-ebisu}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    # BullMQ exige que chaves de fila não sejam despejadas por pressão de memória.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ['/bin/sh', '/scripts/iniciar.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ebisu-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ebisu-dev-secret}
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - ./infra/seaweedfs:/scripts:ro
      - seaweedfs-dados:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ['/bin/sh', '/scripts/criar-bucket.sh']
    environment:
      S3_BUCKET: ${S3_BUCKET:-ebisu-anexos}
    volumes:
      - ./infra/seaweedfs:/scripts:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
  redis-dados:
  seaweedfs-dados:
